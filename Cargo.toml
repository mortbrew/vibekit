[package]
name = "vibekit"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Shared pieces of the *vibe terminal apps: themes, Omarchy sync, Theme Select, self-update"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
flate2 = "1.1.10"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
self-replace = "1.5.0"
serde_json = "1.0.154"
tar = "0.4.46"
toml = { version = "1.1.8", features = ["preserve_order"] }
ureq = "3"
